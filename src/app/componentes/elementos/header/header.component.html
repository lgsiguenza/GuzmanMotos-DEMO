<ion-header [translucent]="true">
  <ion-toolbar class="app-toolbar">
    <ion-row class="ion-align-items-center">

      <!-- Botón Volver 15% -->
      <div class="col volver">
        <ion-button fill="clear" (click)="volver()">
          <ion-icon name="arrow-back-circle-outline"></ion-icon>
        </ion-button>
      </div>

      <!-- Logo 60% -->
      <div class="col logo">
        <img src="assets/guzmanLogo.png" alt="Logo Empresa" class="logo-header">
      </div>

      <!-- Botón Cerrar sesión 15% -->
       @if(this.userSvc.usrActual() != null){
         <div class="col cerrar">
           <ion-button  (click)="cerrarSesion()">
             <ion-icon name="log-out-outline"></ion-icon>
           </ion-button>
         </div>
       } @else{
         <div class="col cerrar" (click)="iniciarSesion()" style="margin-left: 1rem;">
          <ion-button> Iniciar sesión</ion-button>
        </div>

       }

      <!-- Botón Opciones 10% -->
      <div class="col opciones">
      @if(estoyEnControlOCliente){
        <ion-button fill="clear" (click)="irSobreNos()">
          <ion-icon slot="icon-only" name="home-outline"></ion-icon>
        </ion-button>
      }@else{
        <ion-button fill="clear" (click)="irControl()">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>  
      }
    </div>

    </ion-row>
  </ion-toolbar>
</ion-header>
